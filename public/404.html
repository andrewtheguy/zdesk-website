<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>404 — Page not found · zDesk</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<style>
  :root { --bg: #ffffff; --fg: #1b1f24; --muted: #57606a; --accent: #0a5fd6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0d1117; --fg: #e6edf3; --muted: #9da7b3; --accent: #58a6ff; }
  }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 2rem 16px; text-align: center; background: var(--bg); color: var(--fg);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  img { width: 3rem; height: 3rem; }
  h1 { font-size: 1.5rem; margin: 1rem 0 .5rem; }
  p { color: var(--muted); margin: 0 0 1.5rem; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <img src="/logo.svg" alt="">
  <h1>Page not found</h1>
  <p>The page you are looking for doesn't exist or has moved.</p>
  <a href="/">Back to zDesk</a>
</main>
</body>
</html>
